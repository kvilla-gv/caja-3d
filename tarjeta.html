<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarjeta Juntos · 3D</title>
<style>
:root{
  --bg:#F3F3F3;--panel:#FFFFFF;--ink:#1D2120;--muted:#5B6462;--line:#DCDFDD;--chip:#ECEEED;--accent:#4C5A0A;--on-accent:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#17191A;--panel:#202425;--ink:#ECEFEE;--muted:#A0A9A6;--line:#363C3B;--chip:#2A2F2E;--accent:#C9D86A;--on-accent:#1A1F05}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17191A;--panel:#202425;--ink:#ECEFEE;--muted:#A0A9A6;--line:#363C3B;--chip:#2A2F2E;--accent:#C9D86A;--on-accent:#1A1F05}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.legend{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:300px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.legend h1{font-size:16px;margin:0 0 2px}
.legend p{margin:0 0 10px;color:var(--muted);font-size:13px}
.fin{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;margin:8px 0;font-size:13px}
.fin b{display:block;font-size:13px}
.fin span{color:var(--muted)}
.sw{width:18px;height:18px;border-radius:5px;margin-top:1px;border:1px solid var(--line)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bar button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:9px 14px;border-radius:9px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted)}
@media (max-width:700px){.legend{left:10px;right:10px;max-width:none;padding:10px 12px}.legend p{display:none}.hint{display:none}.fin{margin:4px 0}}
</style>
</head>
<body>
<canvas id="c" aria-label="Tarjeta en 3D. Arrastra para girarla."></canvas>
<div class="legend">
  <h1>Tarjeta · 8,56 × 5,4 cm</h1>
  <p>Gírala para ver cómo cambia la luz en cada acabado.</p>
  <div class="fin"><i class="sw" style="background:#8E9A12"></i><div><b>Laminado mate (soft touch)</b><span>Toda la tarjeta, frente y reverso</span></div></div>
  <div class="fin"><i class="sw" style="background:linear-gradient(135deg,#9CA81E,#E9EFC2 50%,#9CA81E)"></i><div><b>Barniz UV brillante</b><span>El “2026” del reverso</span></div></div>
  <div class="fin"><i class="sw" style="background:linear-gradient(135deg,#A9822A,#F1D27A 45%,#B88F2E)"></i><div><b>Hot stamping dorado</b><span>“JUNTOS,” y “MARKETING”</span></div></div>
  <div class="opts">
    <label><input type="checkbox" id="round" checked>Esquinas redondeadas</label>
    <label>Material <select id="mat"><option value="pvc">PVC 0,76 mm (tipo tarjeta bancaria)</option><option value="carton">Cartulina 0,6 mm</option></select></label>
  </div>
</div>
<div class="bar" role="group" aria-label="Vista">
  <button data-v="front" aria-pressed="true">Frente</button>
  <button data-v="back" aria-pressed="false">Reverso</button>
  <button data-v="spin" aria-pressed="false">Girar</button>
</div>
<p class="hint">Arrastra para girar · rueda o pellizco para acercar</p>

const W=8.56,H=5.4,RAD=0.318;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.NoToneMapping;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new THREE.RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(28,1,1,200);camera.position.set(0,0,22);

bg();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',bg);

const loader=new THREE.TextureLoader(),maxAn=renderer.capabilities.getMaxAnisotropy();
const tex=(src,srgb)=>{const t=loader.load(src);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAn;return t;};
/* mapa de acabados: verde = qué tan mate (rugosidad), azul = metal (el dorado) */

const MF=faceMat(TEX.fc,TEX.fm),MB=faceMat(TEX.bc,TEX.bm);
const edgeMat=new THREE.MeshStandardMaterial({color:0xF2F0EA,roughness:0.55,metalness:0});
/* el canto de la tarjeta sin tapas: así las caras impresas no se pelean con otra superficie en el mismo lugar */
const NOCAP=new THREE.MeshBasicMaterial({visible:false});

const card=new THREE.Group();scene.add(card);
function shape(r){const s=new THREE.Shape(),x=-W/2,y=-H/2;r=Math.max(0.001,r);
  s.moveTo(x+r,y);s.lineTo(x+W-r,y);s.quadraticCurveTo(x+W,y,x+W,y+r);s.lineTo(x+W,y+H-r);s.quadraticCurveTo(x+W,y+H,x+W-r,y+H);
  s.lineTo(x+r,y+H);s.quadraticCurveTo(x,y+H,x,y+H-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
function faceGeo(s){const g=new THREE.ShapeGeometry(s,16),p=g.attributes.position,uv=[];
  for(let i=0;i<p.count;i++)uv.push(p.getX(i)/W+0.5,p.getY(i)/H+0.5);g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));return g;}
function buildCard(){
  card.children.slice().forEach(ch=>{card.remove(ch);ch.geometry.dispose();});
  const r=document.getElementById('round').checked?RAD:0.001,T=document.getElementById('mat').value==='pvc'?0.076:0.06,s=shape(r);
  const body=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:T,bevelEnabled:false,curveSegments:16}),[NOCAP,edgeMat]);body.position.z=-T/2;card.add(body);
  const f=new THREE.Mesh(faceGeo(s),MF);f.position.z=T/2+0.0006;card.add(f);
  const b=new THREE.Mesh(faceGeo(s),MB);b.rotation.y=Math.PI;b.position.z=-T/2-0.0006;card.add(b);
  edgeMat.color.set(document.getElementById('mat').value==='pvc'?0xF4F4F1:0xEDE7DA);
}
buildCard();
document.getElementById('round').addEventListener('change',buildCard);
document.getElementById('mat').addEventListener('change',buildCard);

/* vistas: el reverso es vertical, así que al voltear la tarjeta también se gira para leerlo derecho */
const Q={front:new THREE.Quaternion(),back:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.PI).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2))};
const tilt=new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.18,0.32,0));
let target=Q.front.clone().premultiply(tilt),spin=false;
card.quaternion.copy(target);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.v;
  if(v==='spin'){spin=!spin;b.setAttribute('aria-pressed',String(spin));return;}
  spin=false;document.querySelector('[data-v="spin"]').setAttribute('aria-pressed','false');
  document.querySelectorAll('[data-v="front"],[data-v="back"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  target=Q[v].clone().premultiply(tilt);camera.position.set(0,0,22);controls.target.set(0,0,0);controls.update();
  if(reduce)card.quaternion.copy(target);
}));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.setLength(w/h<0.8?34:22);camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
(function loop(){const dt=Math.min(0.05,clock.getDelta());
  if(spin&&!reduce)card.rotateOnWorldAxis(new THREE.Vector3(0,1,0),dt*0.8);
  else card.quaternion.slerp(target,1-Math.pow(0.001,dt));
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);})();
